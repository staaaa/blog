name: Deploy Blog
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy with Docker
        env:
          DOCKER_BUILDKIT: 0
          COMPOSE_DOCKER_CLI_BUILD: 0
        run: |
          docker-compose up -d --build
