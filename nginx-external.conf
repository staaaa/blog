# Nginx config for external domain with SSL
# Place this file at: /etc/nginx/sites-available/gamereviews
# Then: sudo ln -s /etc/nginx/sites-available/gamereviews /etc/nginx/sites-enabled/
# And: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name twoja-domena.pl www.twoja-domena.pl;
    
    # Redirect HTTP to HTTPS (after certbot setup)
    # return 301 https://$server_name$request_uri;
    
    # Temporary: serve directly on HTTP (before SSL)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

