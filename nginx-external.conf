# Nginx config for giercujemy-staa.duckdns.org
# Place this file at: /etc/nginx/sites-available/gamereviews
# Then: sudo ln -s /etc/nginx/sites-available/gamereviews /etc/nginx/sites-enabled/
# And: sudo nginx -t && sudo systemctl reload nginx
#
# After nginx is running, get SSL certificate:
# sudo certbot --nginx -d giercujemy-staa.duckdns.org

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name giercujemy-staa.duckdns.org;

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

