services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: gamereviews-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: game_reviews
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecretpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d game_reviews"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend API
  backend:
    build: ./backend
    container_name: gamereviews-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:-supersecretpassword}@db:5432/game_reviews
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production-to-random-string}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # Angular Frontend + Nginx
  frontend:
    build: ./frontend
    container_name: gamereviews-frontend
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
